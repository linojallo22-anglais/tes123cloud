const CAP=[[0.05, "July 6, 1960."], [2.39, "A seventy-nine-year-old man dies in Geneva."], [5.29, "He leaves behind the most famous watch brand on Earth."], [8.79, "And he leaves it to nobody."], [10.77, "He started out as an orphan from a small town in Bavaria."], [14.07, "He ended up building the watch that movie stars,"], [16.49, "deep-sea explorers and half of all rap lyrics"], [18.95, "are obsessed with."], [20.43, "Today, analysts estimate Rolex sells about"], [22.93, "ten billion Swiss francs of watches a year."], [25.63, "Around one point two million watches."], [27.95, "That's one new Rolex roughly every twenty-seven seconds."], [31.55, "And yet, nobody owns Rolex."], [33.81, "No shareholders."], [34.85, "No stock price."], [35.99, "No billionaire heir with a yacht named after a watch."], [39.17, "So where does all that money go?"], [41.25, "The answer starts with a grieving widower,"], [43.33, "and ends with a charity that hands out hundreds"], [45.59, "of millions a year without making a sound."], [48.66, "Kulmbach, Bavaria."], [50.35, "1881."], [51.75, "Hans Wilsdorf is born into a family of hardware merchants."], [55.09, "At twelve, he loses his mother."], [57.15, "A few months later,"], [58.31, "his father."], [59.35, "His uncles sell the family business and lock"], [61.37, "the money away until the kids grow up."], [63.63, "Not exactly a Disney intro."], [65.75, "Although, to be fair,"], [67.09, "Disney intros are mostly orphans."], [69.09, "He moves to London."], [70.19, "And in 1905,"], [71.37, "at twenty-four, he starts a watch company with his brother-in-law,"], [74.75, "Alfred Davis."], [75.77, "Wilsdorf and Davis."], [77.55, "Catchy."], [78.23, "We'll fix that later."], [79.35, "His big bet?"], [80.35, "The wristwatch."], [81.49, "Here's the thing:"], [82.49, "back then, real men carried pocket watches."], [85.39, "Wristwatches were small,"], [86.99, "inaccurate, and seen as jewelry for women."], [89.25, ""], [91.57, ""], [92.33, ""], [93.59, ""
