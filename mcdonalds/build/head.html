<!doctype html><html><head><meta charset="utf-8"><style>

*{margin:0;padding:0;box-sizing:border-box}

.col{position:absolute;width:280px;opacity:.12}.col i{display:block;height:8px;margin:8px 0;background:#3A2E1E;border-radius:2px}.col b{display:block;height:30px;margin:12px 0 9px;background:#3A2E1E;width:85%}

.o{position:absolute;left:0;top:0;opacity:0;transform-origin:50% 50%}
