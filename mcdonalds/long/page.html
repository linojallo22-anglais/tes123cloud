const CAP=[[0.11, "Every year, McDonald's collects ten billion"], [2.93, "dollars in rent."], [4.49, "Not from selling burgers."], [6.09, "From being a landlord."], [7.69, "And the man who built that machine was a fifty-two-year-old"], [10.55, "milkshake mixer salesman with diabetes,"], [13.03, "arthritis and no gallbladder."], [15.32, "Ten billion dollars a year."], [18.23, "That's about nineteen thousand dollars every single minute."], [21.85, "In rent."], [23.05, "So here's the question."], [24.51, "If McDonald's is really a landlord,"], [26.63, "then what exactly is it selling you?"], [29.05, "And the two brothers who invented the whole thing?"], [31.27, "They ended up with one restaurant,"], [33.03, "no name, and a promise that,"], [34.81, "according to their family,"], [35.99, "was never kept."], [37.55, "San Bernardino, California."], [39.93, "1948."], [40.87, "Brothers Dick and Mac McDonald run a busy drive-in."], [43.96, "Carhops, a big menu."], [45.95, "Then they do something insane."], [48.03, "They shut it down."], [49.41, "They rebuild the kitchen."], [51.01, "Goodbye, carhops."], [52.21, "The menu shrinks to nine items,"], [53.95, "and a hamburger costs fifteen cents."], [56.59, ""], [58.51, ""], [60.49, ""], [61.59, ""], [64.15, "They call it the Speedee Service System."], [66.95, "Translation:"], [67.43, "an assembly line,"], [68.49, "like Henry Ford's car factory,"], [70.01, "but for burgers."], [71.37, "Every worker does one job."], [73.33, "Grill."], [74.05, "Fries."], [74.51, "Shakes."], [75.31, "Again and again."], [76.85, "Picture a Formula One pit stop where everybody"], [79.05, "smells like onions."], [80.37, "It works."], [81.29, "The lines go out the door."], [83.09, "And two thousand miles away,"], [84.55, "a salesman notices something strange in his order book."], [87.87, "Enter Ray Kroc."], [89.37, "Born in 1902,"], [90.47, "near Chicago."], [91.57, "At fifteen, he lies about his age to drive"], [93.77, "a Red Cross ambulance in World War One."], [96.31, "During training, he meets another young driver"], [98.37, "named Walt Disney."], [99.91, "Totally normal people to hang out with."], [102.05, "After the war,"], [102.77, "Kroc tries everything."], [104.45, "Piano player."], [105.47, "Real estate."], [106.31, "Then years selling paper cups for the Lily-Tulip company."], [109.87, "Finally, he goes all in on one product:"], [112.43, "the Multimixer, a machine that makes five milkshakes at once."], [116.67, "Then, in 1954,"], [118.37, "he hears about a little restaurant in California"], [120.57, "using eight of his machines."], [122.55, "Eight."], [123.17, "That's forty milkshakes at the same time."], [125.75, "For one burger stand."], [127.41, "Even a stadium doesn't need that much."], [129.55, "So Kroc goes to see it for himself."], [131.51, "And here's where it gets interesting."], [133.39, "He doesn't see a restaurant."], [135.03, "He sees a photocopier."], [137.11, "If it works here,"], [138.15, "it works everywhere."], [139.75, "The brothers already license a few restaurants,"], [142.25, "but Kroc offers to take franchising nationwide."], [145.61, "Translation:"], [146.81, "local owners pay to use the name and the system."], [149.89, "The deal:"], [150.99, "each new franchise pays nine hundred and fifty dollars,"], [154.18, "and Kroc collects one point nine percent of"], [156.27, "every restaurant's sales."], [157.91, "Half a percent goes to the brothers."], [160.29, "April 15, 1955."], [162.5, "Kroc opens his own McDonald's in Des Plaines,"], [165.33, "Illinois."], [166.13, "He's fifty-two."], [167.59, "In his memoir,"], [168.49, "he lists his health like a grocery list:"], [170.91, "diabetes, arthritis, no gallbladder,"], [174.01, "most of his thyroid gone."], [175.77, "And then he says the best is still ahead of him."], [178.75, "Peak salesman energy."], [180.41, "But there's a problem."], [181.99, ""], [184.03, ""], [188.15, ""], [189.99, ""], [193.14, "Kroc pays for training and inspectors."], [195.75, "His one point four percent barely covers it."], [198.55, "Worse, the contract says he can't change the"], [201.15, "system unless both brothers approve it in writing."], [204.23, "Want to tweak something?"], [205.49, "Send a letter."], [206.79, "Wait."], [207.75, "Hope."], [208.38, "Kroc is building an empire on a salary of crumbs."], [212.45, "Spoiler:"], [213.31, "those crumbs are about to turn into bricks."], [216.11, "Enter Harry Sonneborn."], [217.73, "A finance man from the ice cream chain Tastee-Freez."], [220.89, "He asks one simple question."], [223.15, "What if the money isn't in the burgers?"], [225.57, "In the mid-fifties,"], [226.59, "they set up a separate company called Franchise Realty Corporation."], [230.39, "Here's the plan."], [231.81, "McDonald's leases or buys the land,"], [233.87, "puts up the restaurant,"], [235.03, "then rents the whole package to the franchisee."], [237.75, "With a markup."], [239.11, "Reportedly as high as forty percent."], [241.61, "And the rent?"], [242.61, "A fixed minimum,"], [243.77, "or a percentage of sales,"], [245.41, "whichever is higher."], [246.71, "Translation:"], [247.75, "if the restaurant does badly,"], [249.49, "McDonald's still gets paid."], [251.27, "If it does great,"], [252.49, "McDonald's gets paid more."], [254.03, "Heads I win,"], [255.05, "tails you pay rent."], [257.01, ""], [259.31, ""], [260.99, ""], [264.17, ""], [265.67, "Sonneborn later put it bluntly."], [267.69, "We are not technically in the food business."], [270.09, "We are in the real estate business."], [272.39, "And it works."], [273.53, "In 1958, there are thirty-four McDonald's."], [276.71, "In 1959 alone,"], [278.36, "Kroc opens sixty-seven more."], [280.97, "Sonneborn becomes the company's first president."], [283.41, "There's just one thing Kroc still doesn't own."], [286.47, "The name."], [287.91, "Fast forward to 1961."], [289.89, "Kroc wants the brothers out."], [292.05, "He asks for their price."], [293.69, "The answer:"], [294.41, "two point seven million dollars."], [296.87, "Cash."], [297.73, "Enough for one million each,"], [299.45, "after taxes."], [300.65, ""], [302.95, ""], [304.17, ""], [307.12, "Kroc reportedly went ballistic."], [309.65, "But Sonneborn finds the money,"], [311.53, "including a one-and-a-half-million-dollar loan"], [313.65, "from three insurance companies."], [315.73, "Then, at the closing table,"], [317.31, "a twist."], [318.31, "The brothers are keeping their original restaurant."], [320.81, "They're giving it to their employees."], [322.69, "Kroc is furious."], [324.91, "According to the McDonald family,"], [326.35, "there was also a handshake promise:"], [328.59, "a share of future sales,"], [330.53, "forever."], [331.41, "It was never written down."], [332.91, "And it was never paid."], [334.31, "The brothers' restaurant can't be called McDonald's anymore,"], [337.17, "so it becomes The Big M."], [339.37, "And Kroc?"], [340.29, "He opens a brand-new McDonald's one block away."], [343.22, "Cue the ominous music."], [345.35, "Six years later,"], [346.35, "the Big M closes."], [348.21, "This is the Game of Thrones chapter of the story."], [350.91, "Minus the dragons."], [352.19, "That same year,"], [353.81, "1961, McDonald's opens Hamburger University,"], [356.77, "in the basement of a restaurant in Elk Grove Village,"], [359.27, "Illinois."], [360.09, "The first class:"], [361.29, "fifteen graduates."], [362.67, "Their degree?"], [363.75, "Hamburgerology."], [365.03, "Yes, really."], [366.45, "Then came the money."], [367.91, "April 21, 1965."], [370.59, "McDonald's goes public."], [372.19, "Translation:"], [373.37, "anyone can now buy a piece of it."], [375.03, "Twenty-two dollars and fifty cents a share."], [377.63, "By the end of day one,"], [378.79, "it's around thirty."], [380.06, "Kroc buys a ranch."], [381.61, "As one does."], [382.53, "In 1967, a franchisee near Pittsburgh named"], [385.71, "Jim Delligatti wants a bigger burger for adults."], [388.73, "Two patties, three buns,"], [390.61, "special sauce."], [391.59, "The Big Mac."], [392.81, "The company's most famous product came from a franchisee,"], [396.13, "not headquarters."], [397.27, "And Sonneborn?"], [398.35, "That same year,"], [399.31, "he's convinced a recession is coming."], [401.36, "Kroc wants to keep building."], [403.15, "They clash."], [404.27, "On June 8,"], [405.85, "1967, Sonneborn resigns,"], [407.63, "and sells his stock for several million dollars."], [410.71, "That stock became worth far more."], [413.05, "The real estate genius,"], [414.59, "beaten by his own timing."], [416.37, "Ray Kroc dies on January 14,"], [419.27, "1984."], [419.97, "By then:"], [420.64, "seven thousand five hundred restaurants,"], [422.87, "his own baseball team,"], [424.11, "the San Diego Padres,"], [425.55, "and the word founder next to his name in a"], [427.85, "lot of history books."], [429.25, "And today?"], [430.45, "More than forty-five thousand restaurants."], [433.35, "About ninety-five percent run by franchisees."], [436.27, "In 2024, McDonald's collected ten billion dollars in rent,"], [440.45, "and five point six billion in royalties,"], [442.62, "its cut of sales."], [444.29, "Rent wins by almost two to one."], [446.69, "On its books,"], [447.53, "the company's land and buildings add up to"], [449.57, "more than forty-one billion dollars."], [452.07, "And that's at the price it originally paid."], [454.41, "And the very first McDonald's site in San Bernardino?"], [457.13, "The one piece of land Kroc never got?"], [459.57, "In 1998, after the owner couldn't pay,"], [462.17, "it sold at a foreclosure auction for one hundred"], [465.07, "and thirty-five thousand dollars."], [466.73, "The buyer was the founder of a chicken restaurant chain."], [469.65, "He turned it into an unofficial McDonald's museum."], [472.91, "So what's the lesson?"], [474.61, "Sometimes the product is just the excuse."], [477.13, "The real business is whatever sits
